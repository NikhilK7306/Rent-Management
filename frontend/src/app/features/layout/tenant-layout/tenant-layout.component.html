<div class="tenant-layout">
  <aside 
    class="sidebar" 
    [class.collapsed]="isSidebarCollapsed" 
    [class.mobile-open]="isMobileSidebarOpen"
    [class.overlay]="isMobileSidebarOpen && isMobile"
  >
    <div class="sidebar-header">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span *ngIf="!isSidebarCollapsed">Tenant Portal</span>
      </div>
      <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline *ngIf="!isSidebarCollapsed" points="15 18 9 12 15 6"></polyline>
          <polyline *ngIf="isSidebarCollapsed" points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li *ngFor="let item of navItems" [class.active]="currentRoute === item.path">
          <a 
            [routerLink]="item.path" 
            routerLinkActive="active"
            [class.disabled]="item.disabled"
            (click)="closeMobileSidebar()"
          >
            <span class="nav-icon" [innerHTML]="getIcon(item.label.toLowerCase())"></span>
            <span class="nav-label" *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer" *ngIf="!isSidebarCollapsed">
      <div class="user-info">
        <div class="user-avatar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-details">
          <span class="user-name">{{ getCurrentUser()?.name || 'Tenant' }}</span>
          <span class="user-role">Tenant</span>
        </div>
      </div>
      <button class="btn-logout" (click)="onLogout()" *ngIf="!isSidebarCollapsed">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="main-wrapper">
    <app-header 
      [isSidebarCollapsed]="isSidebarCollapsed" 
      (toggleSidebar)="toggleSidebar()">
    </app-header>

    <main class="main-content" [class.sidebar-collapsed]="isSidebarCollapsed">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div 
    class="sidebar-overlay" 
    *ngIf="isMobileSidebarOpen && isMobile" 
    (click)="closeMobileSidebar()">
  </div>
</div>
