spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  h2:
    console:
      enabled: false

jwt:
  secret: test-secret-key-min-512-bits-for-hmac-sha512-testing-only-must-be-at-least-64-chars-long
  expiration: 86400000

app:
  scheduling:
    enabled: false
  rent:
    auto-generation:
      enabled: false

logging:
  level:
    com.rentms: DEBUG
    org.springframework.security: DEBUG