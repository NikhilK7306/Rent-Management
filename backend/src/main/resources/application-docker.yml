spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:rentdb}
    username: ${DB_USERNAME:rentuser}
    password: ${DB_PASSWORD:rentpass}
  liquibase:
    contexts: docker
  mvc:
    formcontent:
      filter:
        enabled: false

jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-512-bits-for-hmac-sha512-change-in-production-must-be-at-least-64-chars}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.rentms: DEBUG
    org.springframework.security: DEBUG