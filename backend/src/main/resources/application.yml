server:
  port: 8080

spring:
  application:
    name: rent-management-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rentdb}
    username: ${DB_USERNAME:rentuser}
    password: ${DB_PASSWORD:rentpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false
    contexts: dev
    default-schema: public

  security:
    user:
      name: admin
      password: admin

jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-for-hmac-sha256-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.rentms: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN