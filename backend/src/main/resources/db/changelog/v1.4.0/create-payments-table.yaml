databaseChangeLog:
  - changeSet:
      id: 1
      author: rentms
      comment: Create payments table
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rent_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: reference_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: rentms
      comment: Create foreign key for rent_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: rent_id
            constraintName: fk_payments_rent_id
            referencedTableName: rents
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

  - changeSet:
      id: 3
      author: rentms
      comment: Create index on rent_id
      changes:
        - createIndex:
            tableName: payments
            indexName: idx_payments_rent_id
            columns:
              - column:
                  name: rent_id

  - changeSet:
      id: 4
      author: rentms
      comment: Create index on payment_date
      changes:
        - createIndex:
            tableName: payments
            indexName: idx_payments_payment_date
            columns:
              - column:
                  name: payment_date

  - changeSet:
      id: 5
      author: rentms
      comment: Create index on status
      changes:
        - createIndex:
            tableName: payments
            indexName: idx_payments_status
            columns:
              - column:
                  name: status

  - changeSet:
      id: 6
      author: rentms
      comment: Create index on reference_number
      changes:
        - createIndex:
            tableName: payments
            indexName: idx_payments_reference_number
            columns:
              - column:
                  name: reference_number

  - changeSet:
      id: 7
      author: rentms
      comment: Add unique constraint for reference_number (when not null)
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX uq_payments_reference_number ON payments (reference_number) WHERE reference_number IS NOT NULL

  - changeSet:
      id: 8
      author: rentms
      comment: Add check constraint for valid status
      changes:
        - sql:
            sql: ALTER TABLE payments ADD CONSTRAINT chk_payments_status CHECK (status IN ('PENDING', 'PARTIAL', 'PAID', 'OVERDUE', 'CANCELLED'))

  - changeSet:
      id: 9
      author: rentms
      comment: Add check constraint for positive amount
      changes:
        - sql:
            sql: ALTER TABLE payments ADD CONSTRAINT chk_payments_amount_positive CHECK (amount > 0)